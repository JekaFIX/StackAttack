<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stack Attack A52</title>
<style>
*{box-sizing:border-box;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171a0b;color:#c9d66b;font-family:monospace}
#wrap{height:100%;display:flex;align-items:center;justify-content:center;gap:2vw;padding:2vw}
.pad{width:17vw;max-width:150px;display:flex;flex-direction:column;gap:12px}
button{height:clamp(52px,14vh,90px);border:2px solid #82933a;border-radius:8px;background:#333b16;color:#e2ed87;font:bold 20px monospace;box-shadow:inset 0 0 12px #64752a}
button:active{background:#788b2d;color:#101504}
#screen{height:min(92vh,56.25vw);width:min(72vw,163.56vh);max-width:900px;position:relative;border:10px solid #65732c;border-radius:18px;background:#b7c66a;box-shadow:0 0 0 5px #242b10,inset 0 0 28px #75883c;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
@media(max-aspect-ratio:1/1){#screen{width:70vw;height:90vh}.pad{width:13vw}}
</style></head><body>
<div id="wrap">
 <div class="pad"><button id="left">◀</button><button id="jumpL">▲</button></div>
 <div id="screen"><canvas id="game" width="320" height="180"></canvas></div>
 <div class="pad"><button id="right">▶</button><button id="jumpR">▲</button></div>
</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
x.imageSmoothingEnabled=false;
const W=320,H=180, floor=164;
let player={x:151,y:144,w:12,h:20,vx:0,vy:0,on:true}, boxes=[], score=0,level=1,lives=3,frame=0,gameOver=false;
let keys={left:false,right:false,jump:false};
function boxRow(){let n=4+Math.min(level,3);for(let i=0;i<n;i++)boxes.push({x:38+i*62,y:floor-13,w:13,h:13,active:true});}
boxRow();
function bind(id,key){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[key]=true};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>keys[key]=false}
bind('left','left');bind('right','right');bind('jumpL','jump');bind('jumpR','jump');
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key===' '||e.key==='w')keys.jump=true;if(e.key==='Enter'&&gameOver)restart()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key===' '||e.key==='w')keys.jump=false});
function restart(){player={x:151,y:144,w:12,h:20,vx:0,vy:0,on:true};boxes=[];score=0;level=1;lives=3;gameOver=false;boxRow()}
function draw(){
 x.fillStyle='#b7c66a';x.fillRect(0,0,W,H);
 x.fillStyle='#344018';x.fillRect(0,0,W,17);
 x.fillStyle='#e2ed87';x.font='9px monospace';x.fillText('SCORE '+score,8,11);x.fillText('LEVEL '+level,128,11);x.fillText('LIFE '+lives,258,11);
 // side walls and floor
 x.fillStyle='#526326';x.fillRect(12,18,3,146);x.fillRect(305,18,3,146);x.fillRect(12,floor,296,3);
 // crane
 let craneX=40+((frame*0.65)%230);
 x.fillStyle='#64752a';x.fillRect(craneX,20,3,12);x.fillRect(craneX-8,20,19,3);
 x.fillStyle='#3b481b';x.fillRect(craneX-5,32,13,8);
 // blocks
 boxes.forEach(b=>{if(!b.active)return;x.fillStyle='#64752a';x.fillRect(b.x,b.y,b.w,b.h);x.fillStyle='#dce987';x.fillRect(b.x+2,b.y+2,b.w-4,2);x.fillStyle='#879b3c';x.fillRect(b.x+2,b.y+6,b.w-4,5)});
 // player pixel sprite
 x.fillStyle='#344018';x.fillRect(player.x+3,player.y,6,5);x.fillRect(player.x+2,player.y+5,8,8);x.fillRect(player.x,player.y+8,3,8);x.fillRect(player.x+9,player.y+8,3,8);x.fillRect(player.x+2,player.y+13,3,7);x.fillRect(player.x+7,player.y+13,3,7);
 if(gameOver){x.fillStyle='rgba(20,28,7,.8)';x.fillRect(45,65,230,48);x.fillStyle='#edf79a';x.font='bold 15px monospace';x.fillText('GAME OVER',112,85);x.font='9px monospace';x.fillText('TAP ENTER TO RESTART',94,101)}
}
function update(){
 if(!gameOver){
  frame++;player.vx=(keys.left?-1:0)+(keys.right?1:0);player.x+=player.vx*1.6;player.x=Math.max(17,Math.min(291,player.x));
  if(keys.jump&&player.on){player.vy=-4.4;player.on=false}
  player.vy+=0.23;player.y+=player.vy;
  if(player.y+player.h>=floor){player.y=floor-player.h;player.vy=0;player.on=true}
  boxes.forEach(b=>{if(!b.active)return;if(player.x+player.w>b.x&&player.x<b.x+b.w&&player.y+player.h>b.y&&player.y<b.y+b.h){if(player.vy>0&&player.y+player.h-b.y<8){player.y=b.y-player.h;player.vy=0;player.on=true}else if(player.y+player.h>b.y+4){lives--;player.x=151;player.y=144;if(lives<=0)gameOver=true}}});
  if(frame%950===0){level++;boxes.forEach(b=>b.y+=13);boxRow();if(boxes.filter(b=>b.active).length>20){lives--;if(lives<=0)gameOver=true}}
  if(keys.jump&&player.on===false&&player.vy<0){} 
  if(frame%120===0)score+=10;
  // push/clear a box when jumping into it from below
  boxes.forEach(b=>{if(b.active&&player.y+player.h<=b.y+5&&player.y+player.h>=b.y-4&&player.x+player.w>b.x&&player.x<b.x+b.w&&player.vy<0){b.active=false;score+=50}});
 }
 draw();requestAnimationFrame(update)
}
update();
</script></body></html>
